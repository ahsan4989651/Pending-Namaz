<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qaza-e-Umri Calculator</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: linear-gradient(to right, #2575fc, #6a11cb);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: linear-gradient(to right, #6a11cb, #2575fc);
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
    }
    th {
      background-color: #f3f3f3;
    }
    #result {
      margin-top: 30px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Qaza-e-Umri Calculator</h1>
    <label for="pubertyDate">Date you reached puberty:</label>
    <input type="date" id="pubertyDate" />
    <label for="regularDate">Date you started praying regularly:</label>
    <input type="date" id="regularDate" />
    <button onclick="calculateQaza()">Calculate Qaza</button>

    <div id="result"></div>
  </div>

  <script>
    function calculateQaza() {
      const pubertyDate = new Date(document.getElementById('pubertyDate').value);
      const regularDate = new Date(document.getElementById('regularDate').value);
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = "";

      if (isNaN(pubertyDate) || isNaN(regularDate) || regularDate <= pubertyDate) {
        resultDiv.innerHTML = "<p>Please enter valid dates.</p>";
        return;
      }

      const timeDiff = regularDate - pubertyDate;
      const totalDays = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

      const salah = [
        { name: "Fajr", fard: 2, witr: 0 },
        { name: "Zuhr", fard: 4, witr: 0 },
        { name: "Asr",  fard: 4, witr: 0 },
        { name: "Maghrib", fard: 3, witr: 0 },
        { name: "Isha", fard: 4, witr: 3 }
      ];

      let totalRakat = 0;
      let tableHTML = `
        <table>
          <tr>
            <th>Prayer</th>
            <th>Missed Days</th>
            <th>Fard</th>
            <th>Witr</th>
            <th>Total Rakat</th>
          </tr>`;

      salah.forEach(prayer => {
        const fardTotal = prayer.fard * totalDays;
        const witrTotal = prayer.witr * totalDays;
        const totalPrayerRakat = fardTotal + witrTotal;
        totalRakat += totalPrayerRakat;

        tableHTML += `
          <tr>
            <td>${prayer.name}</td>
            <td>${totalDays}</td>
            <td>${fardTotal}</td>
            <td>${witrTotal}</td>
            <td>${totalPrayerRakat}</td>
          </tr>`;
      });

      tableHTML += `
        <tr>
          <th colspan="4">Grand Total</th>
          <th>${totalRakat.toLocaleString()}</th>
        </tr>
        </table>`;

      resultDiv.innerHTML = `
        <p><strong>Total Missed Days:</strong> ${totalDays} days</p>
        ${tableHTML}
        <p><small>* Only Fard and Witr are included. Sunnah are optional in Qaza.</small></p>
      `;
    }
  </script>
</body>
</html>
