<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qaza-e-Umri Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333;
      --button-bg: linear-gradient(to right, #2575fc, #6a11cb);
      --table-header-bg: #f3f3f3;
      --error-color: #e74c3c;
    }
    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #ffffff;
      --button-bg: linear-gradient(to right, #6a11cb, #2575fc);
      --table-header-bg: #333;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }
    .container {
      background: var(--bg-color);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 800px;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: var(--text-color);
    }
    .input-group {
      margin: 15px 0;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, button, select {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #2575fc;
    }
    button {
      background: var(--button-bg);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .error {
      color: var(--error-color);
      font-size: 14px;
      margin-top: 5px;
    }
    table {
      width: 100%;
      margin: 20px 0;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      font-size: 14px;
      text-align: center;
    }
    th {
      background-color: var(--table-header-bg);
    }
    .header-buttons {
      display: flex;
      justify-content: space-between;
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
    }
    #darkModeToggle, #languageSelector {
      background: var(--button-bg);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
    }
    @media (max-width: 480px) {
      h1 { font-size: 22px; }
      input, button { font-size: 14px; padding: 10px; }
      th, td { font-size: 12px; padding: 8px; }
      .container { padding: 20px; }
      .header-buttons { flex-direction: column; align-items: flex-start; }
      .header-buttons button, .header-buttons select { margin-bottom: 10px; }
    }
  </style>
</head>
<body>
  <div class="header-buttons">
    <button id="darkModeToggle">🌙 Dark Mode</button>
    <select id="languageSelector">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="ur">اردو</option>
      <option value="bn">বাংলা</option>
      <option value="roman-hi">Roman Hindi</option>
      <option value="roman-ur">Roman Urdu</option>
    </select>
  </div>

  <div class="container">
    <h1 id="title">Qaza-e-Umri Calculator</h1>
    <div class="input-group">
      <label id="birthLabel" for="birthDate">Your Birth Date:</label>
      <input type="date" id="birthDate" required />
      <div id="birthError" class="error"></div>
    </div>
    <div class="input-group">
      <label id="pubertyLabel" for="pubertyDate">Date you reached puberty:</label>
      <input type="date" id="pubertyDate" required />
      <div id="pubertyError" class="error"></div>
    </div>
    <div class="input-group">
      <label id="regularLabel" for="regularDate">Date you started praying regularly:</label>
      <input type="date" id="regularDate" required />
      <div id="regularError" class="error"></div>
    </div>
    <button id="calculateBtn">Calculate Qaza</button>
    <div id="result"></div>
  </div>

  <script>
    const languageData = {
      en: {
        title: "Qaza-e-Umri Calculator",
        birthLabel: "Your Birth Date:",
        pubertyLabel: "Date you reached puberty:",
        regularLabel: "Date you started praying regularly:",
        calculateBtn: "Calculate Qaza",
        totalMissedDays: "Total Missed Days",
        totalNamaz: "Total Namaz",
        totalFard: "Total Fard Rakat",
        totalWitr: "Total Witr Rakat",
        ageAtPuberty: "Age at Puberty",
        summary: "Summary",
        downloadPdf: "Download PDF",
        errorInvalidDates: "Please enter valid dates.",
        errorFutureDate: "Dates cannot be in the future.",
        errorPubertyBeforeBirth: "Puberty date must be after birth date.",
        errorRegularBeforePuberty: "Regular prayer date must be after puberty date."
      },
      hi: {
        title: "क़ज़ा-ए-उमरी कैलकुलेटर",
        birthLabel: "आपकी जन्मतिथि:",
        pubertyLabel: "आपने प्यूबर्टी कब प्राप्त की:",
        regularLabel: "नियमित नमाज़ शुरू करने की तिथि:",
        calculateBtn: "क़ज़ा की गणना करें",
        totalMissedDays: "कुल छूटे दिन",
        totalNamaz: "कुल नमाज़",
        totalFard: "कुल फ़र्ज़ रकात",
        totalWitr: "कुल वित्र रकात",
        ageAtPuberty: "प्यूबर्टी की आयु",
        summary: "सारांश",
        downloadPdf: "पीडीएफ डाउनलोड करें",
        errorInvalidDates: "कृपया वैध तिथियाँ दर्ज करें।",
        errorFutureDate: "तिथियाँ भविष्य की नहीं हो सकतीं।",
        errorPubertyBeforeBirth: "प्यूबर्टी की तिथि जन्म तिथि के बाद होनी चाहिए।",
        errorRegularBeforePuberty: "नियमित नमाज़ की तिथि प्यूबर्टी के बाद होनी चाहिए।"
      },
      // Add other languages as needed
    };

    let currentLanguage = localStorage.getItem('language') || 'en';
    updateLanguage(currentLanguage);

    document.getElementById('languageSelector').addEventListener('change', (e) => {
      currentLanguage = e.target.value;
      localStorage.setItem('language', currentLanguage);
      updateLanguage(currentLanguage);
    });

    function updateLanguage(lang) {
      console.log('Updating language to:', lang);
      const data = languageData[lang] || languageData.en;
      document.getElementById('title').textContent = data.title;
      document.getElementById('birthLabel').textContent = data.birthLabel;
      document.getElementById('pubertyLabel').textContent = data.pubertyLabel;
      document.getElementById('regularLabel').textContent = data.regularLabel;
      document.getElementById('calculateBtn').textContent = data.calculateBtn;
    }

    document.getElementById('darkModeToggle').addEventListener('click', () => {
      document.documentElement.toggleAttribute('data-theme', 'dark');
      document.getElementById('darkModeToggle').textContent = 
        document.documentElement.hasAttribute('data-theme') ? '☀️ Light Mode' : '🌙 Dark Mode';
    });

    document.getElementById('calculateBtn').addEventListener('click', calculateQaza);

    function calculateQaza() {
      console.log('Calculating Qaza...');
      const birthDate = new Date(document.getElementById('birthDate').value);
      const pubertyDate = new Date(document.getElementById('pubertyDate').value);
      const regularDate = new Date(document.getElementById('regularDate').value);
      const resultDiv = document.getElementById('result');
      const today = new Date();

      // Reset errors
      document.getElementById('birthError').textContent = '';
      document.getElementById('pubertyError').textContent = '';
      document.getElementById('regularError').textContent = '';
      resultDiv.innerHTML = '';

      // Validation
      if (!birthDate.getTime() || !pubertyDate.getTime() || !regularDate.getTime()) {
        resultDiv.innerHTML = `<p class="error">${languageData[currentLanguage].errorInvalidDates}</p>`;
        console.error('Invalid date input');
        return;
      }

      if (birthDate > today || pubertyDate > today || regularDate > today) {
        resultDiv.innerHTML = `<p class="error">${languageData[currentLanguage].errorFutureDate}</p>`;
        console.error('Future date detected');
        return;
      }

      if (pubertyDate <= birthDate) {
        document.getElementById('pubertyError').textContent = languageData[currentLanguage].errorPubertyBeforeBirth;
        console.error('Puberty date before birth');
        return;
      }

      if (regularDate <= pubertyDate) {
        document.getElementById('regularError').textContent = languageData[currentLanguage].errorRegularBeforePuberty;
        console.error('Regular date before puberty');
        return;
      }

      // Calculations
      console.log('Dates valid, calculating...');
      const ageAtPuberty = Math.floor((pubertyDate - birthDate) / (1000 * 60 * 60 * 24 * 365.25));
      const totalDays = Math.floor((regularDate - pubertyDate) / (1000 * 60 * 60 * 24));

      const salah = [
        { name: "Fajr", fard: 2, witr: 0 },
        { name: "Zuhr", fard: 4, witr: 0 },
        { name: "Asr", fard: 4, witr: 0 },
        { name: "Maghrib", fard: 3, witr: 0 },
        { name: "Isha", fard: 4, witr: 3 }
      ];

      let totalFard = 0;
      let totalWitr = 0;
      const totalNamaz = totalDays * 5;

      const prayerBreakdown = salah.map(prayer => {
        const missedFard = prayer.fard * totalDays;
        const missedWitr = prayer.witr * totalDays;
        totalFard += missedFard;
        totalWitr += missedWitr;
        return {
          name: prayer.name,
          fard: missedFard,
          witr: missedWitr,
          total: missedFard + missedWitr
        };
      });

      console.log('Prayer breakdown:', prayerBreakdown);

      // Generate HTML
      let html = `
        <h3>${languageData[currentLanguage].summary}</h3>
        <p>${languageData[currentLanguage].ageAtPuberty}: <strong>${ageAtPuberty}</strong></p>
        <table>
          <tr>
            <th>Prayer</th>
            <th>Fard Rakat</th>
            <th>Witr Rakat</th>
            <th>Total Rakat</th>
          </tr>`;

      prayerBreakdown.forEach(prayer => {
        html += `
          <tr>
            <td>${prayer.name}</td>
            <td>${prayer.fard}</td>
            <td>${prayer.witr}</td>
            <td>${prayer.total}</td>
          </tr>`;
      });

      html += `
        <tr>
          <th>Total</th>
          <th>${totalFard}</th>
          <th>${totalWitr}</th>
          <th>${totalFard + totalWitr}</th>
        </tr>
        </table>
        <h4>Summary Statistics</h4>
        <table>
          <tr><th>${languageData[currentLanguage].totalMissedDays}</th><td>${totalDays}</td></tr>
          <tr><th>${languageData[currentLanguage].totalNamaz}</th><td>${totalNamaz}</td></tr>
          <tr><th>${languageData[currentLanguage].totalFard}</th><td>${totalFard}</td></tr>
          <tr><th>${languageData[currentLanguage].totalWitr}</th><td>${totalWitr}</td></tr>
        </table>
        <br>
        <button onclick="downloadPDF()">${languageData[currentLanguage].downloadPdf}</button>`;

      resultDiv.innerHTML = html;
      console.log('Result displayed');
    }

    function downloadPDF() {
      console.log('Generating PDF...');
      const element = document.getElementById("result");
      if (!element.innerHTML) {
        console.error('No result content to generate PDF');
        return;
      }
      const options = {
        filename: 'qaza-e-umri.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().from(element).set(options).save().then(() => {
        console.log('PDF generated successfully');
      }).catch(err => {
        console.error('PDF generation failed:', err);
      });
    }
  </script>
</body>
</html>
