<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qaza-e-Umri Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333;
      --button-bg: linear-gradient(to right, #2575fc, #6a11cb);
      --table-header-bg: #f3f3f3;
    }
    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #ffffff;
      --button-bg: linear-gradient(to right, #6a11cb, #2575fc);
      --table-header-bg: #333;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }
    .container {
      background: var(--bg-color);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 700px;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: var(--text-color);
    }
    label {
      display: block;
      margin-top: 10px;
      text-align: left;
      font-weight: 600;
    }
    input, button, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: var(--button-bg);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: var(--button-bg);
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      overflow-x: auto;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      font-size: 14px;
      text-align: center;
    }
    th {
      background-color: var(--table-header-bg);
    }
    #darkModeToggle, #languageSelector {
      background: var(--button-bg);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
    }
    .header-buttons {
      display: flex;
      justify-content: space-between;
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
    }
    .header-buttons button, .header-buttons select {
      font-size: 14px;
      padding: 8px 15px;
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 20px;
      }
      input, button {
        font-size: 14px;
        padding: 10px;
      }
      th, td {
        font-size: 12px;
        padding: 8px;
      }
      .container {
        padding: 20px;
      }
      .header-buttons {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-buttons button, .header-buttons select {
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="header-buttons">
    <button id="darkModeToggle">🌙 Dark Mode</button>
    <select id="languageSelector">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="ur">اردو</option>
      <option value="bn">বাংলা</option>
      <option value="roman-hi">Roman Hindi</option>
      <option value="roman-ur">Roman Urdu</option>
    </select>
  </div>

  <div class="container">
    <h1 id="title">Qaza-e-Umri Calculator</h1>
    <label id="birthLabel" for="birthDate">Your Birth Date:</label>
    <input type="date" id="birthDate" />
    <label id="pubertyLabel" for="pubertyDate">Date you reached puberty:</label>
    <input type="date" id="pubertyDate" />
    <label id="regularLabel" for="regularDate">Date you started praying regularly:</label>
    <input type="date" id="regularDate" />
    <button id="calculateBtn">Calculate Qaza</button>
    <div id="result"></div>
  </div>

  <script>
    const languageData = {
      en: {
        title: "Qaza-e-Umri Calculator",
        birthLabel: "Your Birth Date:",
        pubertyLabel: "Date you reached puberty:",
        regularLabel: "Date you started praying regularly:",
        calculateBtn: "Calculate Qaza",
        totalMissedDays: "Total Missed Days:",
        totalMissedNamaz: "Total Missed Namaz:",
        ageAtPuberty: "You became responsible at age:",
        summary: "Summary",
        downloadPdf: "Download PDF"
      },
      hi: {
        title: "क़ज़ा-ए-उमरी कैलकुलेटर",
        birthLabel: "आपकी जन्मतिथि:",
        pubertyLabel: "तबियत के प्यूबर्टी के दिन:",
        regularLabel: "जब से आप नमाज़ अदा करने लगे:",
        calculateBtn: "क़ज़ा की गणना करें",
        totalMissedDays: "कुल मिस्ड दिन:",
        totalMissedNamaz: "कुल मिस्ड नमाज़:",
        ageAtPuberty: "आप किस उम्र में जिम्मेदार हो गए थे:",
        summary: "सारांश",
        downloadPdf: "पीडीएफ डाउनलोड करें"
      },
      ur: {
        title: "قضاے عمری کیلکولیٹر",
        birthLabel: "آپ کی پیدائش کی تاریخ:",
        pubertyLabel: "آپ نے بلوغت کی عمر کب پائی:",
        regularLabel: "آپ کب سے نماز پڑھ رہے ہیں:",
        calculateBtn: "قضا کا حساب لگائیں",
        totalMissedDays: "مجموعی طور پر چھوٹے دن:",
        totalMissedNamaz: "مجموعی طور پر چھوٹی نماز:",
        ageAtPuberty: "آپ کس عمر میں ذمہ دار ہو گئے تھے:",
        summary: "خلاصہ",
        downloadPdf: "پی ڈی ایف ڈاؤن لوڈ کریں"
      },
      bn: {
        title: "কাজা-এ-উমরি ক্যালকুলেটর",
        birthLabel: "আপনার জন্ম তারিখ:",
        pubertyLabel: "আপনি কখন পরিপূর্ণতা লাভ করেছেন:",
        regularLabel: "আপনি কখন থেকে নামাজ শুরু করেছেন:",
        calculateBtn: "কাজা হিসাব করুন",
        totalMissedDays: "মোট মিসড দিন:",
        totalMissedNamaz: "মোট মিসড নামাজ:",
        ageAtPuberty: "আপনি কত বছর বয়সে দায়িত্ববান হয়ে গেছেন:",
        summary: "সারাংশ",
        downloadPdf: "পিডিএফ ডাউনলোড করুন"
      },
      "roman-hi": {
        title: "Qaza-e-Umri Calculator",
        birthLabel: "Aapki Paidaaish ki Tareekh:",
        pubertyLabel: "Aapne Puberty ki Umar Kab Paayi:",
        regularLabel: "Aap Kab Se Namaz Pardh Rahe Hain:",
        calculateBtn: "Qaza Ki Hisab Lagayein",
        totalMissedDays: "Kul Missed Din:",
        totalMissedNamaz: "Kul Missed Namaz:",
        ageAtPuberty: "Aap Kis Umar Mein Zimmedar Ho Gaye The:",
        summary: "Summary",
        downloadPdf: "PDF Download Karein"
      },
      "roman-ur": {
        title: "Qaza-e-Umri Calculator",
        birthLabel: "Aap Ki Paidaish Ki Tareekh:",
        pubertyLabel: "Aap Ne Puberty Ki Umar Kab Paayi:",
        regularLabel: "Aap Kab Se Namaz Pardh Rahe Hain:",
        calculateBtn: "Qaza Ka Hisab Lagayein",
        totalMissedDays: "Kul Missed Din:",
        totalMissedNamaz: "Kul Missed Namaz:",
        ageAtPuberty: "Aap Kis Umar Mein Zimmedar Ho Gaye The:",
        summary: "Summary",
        downloadPdf: "PDF Download Karein"
      }
    };

    let currentLanguage = localStorage.getItem('language') || 'en';
    updateLanguage(currentLanguage);

    document.getElementById('languageSelector').addEventListener('change', (e) => {
      currentLanguage = e.target.value;
      localStorage.setItem('language', currentLanguage);
      updateLanguage(currentLanguage);
    });

    function updateLanguage(lang) {
      document.getElementById('title').textContent = languageData[lang].title;
      document.getElementById('birthLabel').textContent = languageData[lang].birthLabel;
      document.getElementById('pubertyLabel').textContent = languageData[lang].pubertyLabel;
      document.getElementById('regularLabel').textContent = languageData[lang].regularLabel;
      document.getElementById('calculateBtn').textContent = languageData[lang].calculateBtn;
    }

    const toggle = document.getElementById('darkModeToggle');
    toggle.addEventListener('click', () => {
      document.documentElement.toggleAttribute('data-theme', 'dark');
      toggle.textContent = document.documentElement.hasAttribute('data-theme') ? '☀️ Light Mode' : '🌙 Dark Mode';
    });

    window.onload = function () {
      document.getElementById('calculateBtn').addEventListener('click', function () {
        const birthDate = new Date(document.getElementById('birthDate').value);
        const pubertyDate = new Date(document.getElementById('pubertyDate').value);
        const regularDate = new Date(document.getElementById('regularDate').value);
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = "";

        if (isNaN(birthDate) || isNaN(pubertyDate) || isNaN(regularDate) || pubertyDate <= birthDate || regularDate <= pubertyDate) {
          resultDiv.innerHTML = "<p>Please enter valid dates in the correct order.</p>";
          return;
        }

        const ageAtPuberty = Math.floor((pubertyDate - birthDate) / (1000 * 60 * 60 * 24 * 365.25));
        const totalDays = Math.floor((regularDate - pubertyDate) / (1000 * 60 * 60 * 24));
        const totalNamaz = totalDays * 5;

        const salah = [
          { name: "Fajr", fard: 2, witr: 0 },
          { name: "Zuhr", fard: 4, witr: 0 },
          { name: "Asr", fard: 4, witr: 0 },
          { name: "Maghrib", fard: 3, witr: 0 },
          { name: "Isha", fard: 4, witr: 1 }
        ];
        
        let missedNamaz = totalNamaz;

        resultDiv.innerHTML = `
          <p><strong>${languageData[currentLanguage].ageAtPuberty}</strong> ${ageAtPuberty} years old.</p>
          <p><strong>${languageData[currentLanguage].totalMissedDays}</strong> ${totalDays} days.</p>
          <p><strong>${languageData[currentLanguage].totalMissedNamaz}</strong> ${missedNamaz} Rakats missed.</p>
          <button onclick="generatePDF()">${languageData[currentLanguage].downloadPdf}</button>
        `;
      });
    };

    function generatePDF() {
      const element = document.querySelector('.container');
      html2pdf().from(element).save('Qaza-e-Umri-Report.pdf');
    }
  </script>
</body>
</html>
