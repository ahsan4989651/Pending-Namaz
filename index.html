<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Qaza Calculator</title>
  <style>
    /* Original UI Colors */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #4CAF50;
    }

    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 30px 0;
      justify-content: center;
    }

    .form-group input {
      padding: 10px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background-color: white;
      color: #333;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      background-color: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f8f8f8;
    }

    .download-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

    .note {
      margin-top: 15px;
      color: #555;
    }

    /* Dark Mode (Preserving Original UI Structure) */
    [data-theme="dark"] body {
      background-color: #1e1e1e;
      color: #f0f0f0;
    }

    [data-theme="dark"] .form-group input,
    [data-theme="dark"] table {
      background-color: #2d2d2d;
      color: #f0f0f0;
    }

    [data-theme="dark"] th {
      background-color: #81c784;
    }

    [data-theme="dark"] tr:nth-child(even) {
      background-color: #3a3a3a;
    }

    [data-theme="dark"] .error {
      color: #ef5350;
    }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 20px;
      background: #666;
      border-radius: 30px;
      padding: 4px;
      box-sizing: border-box;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .theme-toggle::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      left: 4px;
      top: 4px;
      transition: transform 0.3s;
    }

    [data-theme="dark"] .theme-toggle {
      background: #bbb;
    }

    [data-theme="dark"] .theme-toggle::before {
      background: #1e1e1e;
      transform: translateX(18px);
    }
  </style>
</head>
<body data-theme="light">
  <div class="theme-toggle" onclick="toggleTheme()"></div>
  
  <div class="container">
    <h1>Qaza Prayer Calculator</h1>
    
    <div class="form-group">
      <label>
        Puberty Date:
        <input type="date" id="pubertyDate">
      </label>
      <label>
        Regular Prayer Date:
        <input type="date" id="regularDate">
      </label>
      <button id="calculateBtn">Calculate</button>
    </div>
    
    <div id="result"></div>
  </div>

  <script>
    // Theme toggle functionality
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }

    // Initialize theme
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    });

    // Main calculator
    window.onload = function () {
      document.getElementById('calculateBtn').addEventListener('click', function () {
        const pubertyDate = new Date(document.getElementById('pubertyDate').value);
        const regularDate = new Date(document.getElementById('regularDate').value);
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = "";

        // Validate dates
        if (isNaN(pubertyDate.getTime()) || isNaN(regularDate.getTime()) || regularDate <= pubertyDate) {
          resultDiv.innerHTML = "<p class='error'>Please enter valid dates where Regular Prayer Date is after Puberty Date.</p>";
          return;
        }

        // Calculate date differences
        const timeDiff = regularDate - pubertyDate;
        const totalDays = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
        const totalNamaz = totalDays * 5;

        // Prayer data with Fard and Witr counts
        const salah = [
          { name: "Fajr", fard: 2, witr: 0 },
          { name: "Zuhr", fard: 4, witr: 0 },
          { name: "Asr",  fard: 4, witr: 0 },
          { name: "Maghrib", fard: 3, witr: 0 },
          { name: "Isha", fard: 4, witr: 3 }
        ];

        // Initialize totals
        let totalRakat = 0;
        let totalFarz = 0;
        let totalWitr = 0;
        let csvData = "Prayer,Missed,Fard,Witr,Total Rakat\n";

        // Build table HTML
        let tableHTML = `
          <table>
            <tr>
              <th>Prayer</th>
              <th>Missed</th>
              <th>Fard</th>
              <th>Witr</th>
              <th>Total Rakat</th>
              <th>Completed</th>
            </tr>`;

        // Generate rows for each prayer
        salah.forEach((prayer, index) => {
          const fardTotal = prayer.fard * totalDays;
          const witrTotal = prayer.witr * totalDays;
          const totalPrayerRakat = fardTotal + witrTotal;
          
          // Update totals
          totalRakat += totalPrayerRakat;
          totalFarz += fardTotal;
          totalWitr += witrTotal;

          // Add prayer row to CSV
          csvData += `${prayer.name},${totalDays},${fardTotal},${witrTotal},${totalPrayerRakat}\n`;

          // Add checkbox state persistence
          const checked = localStorage.getItem(`prayer_${index}`) === "true" ? "checked" : "";

          // Add prayer row to table
          tableHTML += `
            <tr>
              <td>${prayer.name}</td>
              <td>${totalDays}</td>
              <td>${fardTotal}</td>
              <td>${witrTotal}</td>
              <td>${totalPrayerRakat}</td>
              <td>
                <input type="checkbox" id="check_${index}" ${checked} onchange="localStorage.setItem('prayer_${index}', this.checked)">
              </td>
            </tr>`;
        });

        // Add totals row to table
        tableHTML += `
          <tr>
            <td><strong>Total</strong></td>
            <td>${totalNamaz}</td>
            <td>${totalFarz}</td>
            <td>${totalWitr}</td>
            <td>${totalFarz + totalWitr}</td>
            <td></td>
          </tr>`;

        // Add grand total row
        tableHTML += `
          <tr>
            <th colspan="4">Grand Total (Rakats)</th>
            <th>${totalRakat.toLocaleString()}</th>
            <td></td>
          </tr>
          </table>`;

        // Add CSV totals row
        csvData += `\nTotal,${totalNamaz},${totalFarz},${totalWitr},${totalRakat}\n`;

        // Update result div with final content
        resultDiv.innerHTML = `
          ${tableHTML}
          <button onclick="downloadCSV()" class="download-btn">📥 Download CSV</button>
          <p class="note"><small>* Only Fard and Witr are included. Sunnah are optional in Qaza.</small></p>
        `;

        // Store CSV in global for download
        window.qazaCSV = csvData;
      });

      // CSV download functionality
      window.downloadCSV = function () {
        const blob = new Blob([window.qazaCSV], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "qaza_report.csv";
        a.click();
        URL.revokeObjectURL(url);
      };
    };
  </script>
</body>
</html>
