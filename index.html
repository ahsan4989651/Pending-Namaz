<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qaza-e-Umri Calculator</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      text-align: center;
      box-sizing: border-box;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 20px;
      background: #666;
      border-radius: 30px;
      padding: 4px;
      box-sizing: border-box;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .theme-toggle::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      left: 4px;
      top: 4px;
      transition: transform 0.3s;
    }

    [data-theme="dark"] .theme-toggle {
      background: #bbb;
    }

    [data-theme="dark"] .theme-toggle::before {
      background: #000;
      transform: translateX(18px);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 10px;
      text-align: left;
      font-weight: 600;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: linear-gradient(to right, #2575fc, #6a11cb);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: linear-gradient(to right, #6a11cb, #2575fc);
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      font-size: 14px;
    }

    th {
      background-color: #f3f3f3;
    }

    #result {
      margin-top: 30px;
      text-align: left;
      overflow-x: auto;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 20px;
      }

      input, button {
        font-size: 14px;
        padding: 10px;
      }

      th, td {
        font-size: 12px;
        padding: 8px;
      }

      .container {
        padding: 20px;
      }
    }

    /* Dark Mode Overrides */
    [data-theme="dark"] body {
      background: #000;
      color: #fff;
    }

    [data-theme="dark"] .container {
      background: #1a1a1a;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.05);
    }

    [data-theme="dark"] h1,
    [data-theme="dark"] label {
      color: #fff;
    }

    [data-theme="dark"] input,
    [data-theme="dark"] button,
    [data-theme="dark"] th,
    [data-theme="dark"] td {
      background: #222;
      color: #fff;
      border-color: #444;
    }

    [data-theme="dark"] th {
      background-color: #333;
    }

    [data-theme="dark"] tr:nth-child(even) {
      background-color: #2a2a2a;
    }

    [data-theme="dark"] button {
      background: linear-gradient(to right, #0f2027, #203a43);
    }

    [data-theme="dark"] button:hover {
      background: linear-gradient(to right, #203a43, #0f2027);
    }

    [data-theme="dark"] .error {
      color: #ef5350;
    }
  </style>
</head>
<body data-theme="light">
  <div class="theme-toggle" onclick="toggleTheme()"></div>
  
  <div class="container">
    <h1>Qaza-e-Umri Calculator</h1>
    
    <!-- Date of Birth with Example -->
    <label for="birthDate">Date of Birth:</label>
    <input type="date" id="birthDate" value="1995-01-01" />
    
    <label for="pubertyDate">Date you reached puberty:</label>
    <input type="date" id="pubertyDate" value="2010-01-01" />
    
    <label for="regularDate">Date you started praying regularly:</label>
    <input type="date" id="regularDate" value="2020-01-01" />
    
    <button id="calculateBtn">Calculate Qaza</button>
    
    <div id="result"></div>
  </div>

  <script>
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }

    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    });

    window.onload = function () {
      document.getElementById('calculateBtn').addEventListener('click', function () {
        const birthDate = new Date(document.getElementById('birthDate').value);
        const pubertyDate = new Date(document.getElementById('pubertyDate').value);
        const regularDate = new Date(document.getElementById('regularDate').value);
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = "";

        if (isNaN(birthDate.getTime()) || isNaN(pubertyDate.getTime()) || isNaN(regularDate.getTime())) {
          resultDiv.innerHTML = "<p class='error'>Please enter all dates.</p>";
          return;
        }

        if (pubertyDate <= birthDate || regularDate <= pubertyDate) {
          resultDiv.innerHTML = "<p class='error'>Dates must follow: Birth < Puberty < Regular Prayer.</p>";
          return;
        }

        const timeDiff = regularDate - pubertyDate;
        const totalDays = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
        const totalNamaz = totalDays * 5;

        const salah = [
          { name: "Fajr", fard: 2, witr: 0 },
          { name: "Zuhr", fard: 4, witr: 0 },
          { name: "Asr", fard: 4, witr: 0 },
          { name: "Maghrib", fard: 3, witr: 0 },
          { name: "Isha", fard: 4, witr: 3 }
        ];

        let totalRakat = 0;
        let totalFarz = 0;
        let totalWitr = 0;
        let csvData = "Prayer,Missed Days,Fard,Witr,Total Rakat\n";

        let tableHTML = `
          <table>
            <tr>
              <th>Prayer</th>
              <th>Missed Days</th>
              <th>Fard</th>
              <th>Witr</th>
              <th>Total Rakat</th>
            </tr>`;

        salah.forEach(prayer => {
          const fardTotal = prayer.fard * totalDays;
          const witrTotal = prayer.witr * totalDays;
          const totalPrayerRakat = fardTotal + witrTotal;
          totalRakat += totalPrayerRakat;
          totalFarz += fardTotal;
          totalWitr += witrTotal;

          csvData += `${prayer.name},${totalDays},${fardTotal},${witrTotal},${totalPrayerRakat}\n`;

          tableHTML += `
            <tr>
              <td>${prayer.name}</td>
              <td>${totalDays}</td>
              <td>${fardTotal}</td>
              <td>${witrTotal}</td>
              <td>${totalPrayerRakat}</td>
            </tr>`;
        });

        csvData += `\nTotal,${totalDays},${totalFarz},${totalWitr},${totalRakat}`;

        tableHTML += `
          <tr>
            <td><strong>Total</strong></td>
            <td><strong>${totalNamaz}</strong></td>
            <td><strong>${totalFarz}</strong></td>
            <td><strong>${totalWitr}</strong></td>
            <td><strong>${totalRakat.toLocaleString()}</strong></td>
          </tr>
          </table>`;

        resultDiv.innerHTML = `
          <p><strong>Total Missed Days:</strong> ${totalDays} days</p>
          ${tableHTML}
          <button onclick="downloadCSV()" style="margin-top:10px;">📥 Download CSV</button>
          <p><small>* Only Fard and Witr are included. Sunnah are optional in Qaza.</small></p>
        `;

        window.qazaCSV = csvData;
      });
    };

    window.downloadCSV = function () {
      const blob = new Blob([window.qazaCSV], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "qaza_report.csv";
      a.click();
      URL.revokeObjectURL(url);
    };
  </script>
</body>
</html>
